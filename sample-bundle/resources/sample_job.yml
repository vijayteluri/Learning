resources:
  jobs:
    Sample_Job:
      name: Sample Job
      tasks:
        - task_key: sample
          notebook_task:
            notebook_path: ../src/notebooks/Sample.ipynb
            source: WORKSPACE
            base_parameters:
              Catalog_name: ${var.Catalog_name}
              Schema_name: ${var.Schema_name}
      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED
